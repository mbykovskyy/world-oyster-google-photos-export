<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <div>
      <h1><img src="icons/48.png" alt="" class="logo">World Oyster</h1>
      <div id="count" class="muted">0 selected</div>
    </div>
    <label class="switch" title="Show the World Oyster buttons on Google Photos">
      <input type="checkbox" id="enabled">
      <span>Picker on</span>
    </label>
  </header>

  <div class="actions">
    <button id="export" type="button" class="primary" title="Export selected photos">Export</button>
    <button id="retry" type="button" hidden>Retry failed</button>
    <button id="clear" type="button" class="danger">Clear all</button>
  </div>

  <p id="export-status" hidden></p>
  <p id="empty" class="muted">Click the World Oyster logo in the top-right corner of any photo in Google Photos. Shift+click selects a range. Selections are saved as you go.</p>
  <div id="grid"></div>
  <!-- Photo viewer: opened by clicking a tile. ←/→ step through the selection,
       D or the trash bin removes it (and moves to the next photo), Esc closes. -->
  <div id="viewer" role="dialog" aria-label="Photo preview" tabindex="-1" hidden>
    <div class="v-top">
      <button id="v-close" class="v-btn" type="button" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
      <button id="v-remove" class="v-btn" type="button" title="Remove (d)" aria-label="Remove"></button>
      <a id="v-open" href="#" target="_blank" title="Open in Google Photos">Open in Google Photos ↗</a>
    </div>
    <div class="v-stage">
      <img id="v-img" alt="">
      <span id="v-spin" class="v-spin" hidden></span>
      <button id="v-prev" class="v-btn v-nav" type="button" title="Previous (←)" aria-label="Previous"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
      <button id="v-next" class="v-btn v-nav" type="button" title="Next (→)" aria-label="Next"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></button>
    </div>
    <div class="v-info">
      <div class="v-text">
        <div id="v-place"></div>
        <div id="v-date" class="dim"></div>
        <div id="v-msg"></div>
      </div>
      <span id="v-pos"></span>
    </div>
  </div>

  <footer class="muted">Place names: <a href="https://www.geonames.org" target="_blank">GeoNames</a> (CC BY 4.0) · coordinates: <a href="https://www.openstreetmap.org/copyright" target="_blank">© OpenStreetMap</a></footer>

  <script type="module" src="panel.js"></script>
</body>
</html>
